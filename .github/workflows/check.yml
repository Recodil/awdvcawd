name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck libegl1 libgl1 libxkbcommon0 libfontconfig1 zip
          pip install --quiet pyside6-essentials
      - name: Check
        run: CI_ARTIFACT="$PWD/win11-shell-install.sh" bash ci/check.sh
      - name: Build zip
        run: |
          mkdir -p /tmp/pack
          rsync -av --exclude='.git' --exclude='.github' --exclude='win11-shell-install.sh' --exclude='win11-shell.zip' ./ /tmp/pack/win11-shell/
          (cd /tmp/pack && zip -rq "$GITHUB_WORKSPACE/win11-shell.zip" win11-shell)
      - uses: actions/upload-artifact@v4
        with:
          name: win11-shell-packages
          path: |
            win11-shell-install.sh
            win11-shell.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            win11-shell-install.sh
            win11-shell.zip
          generate_release_notes: true
